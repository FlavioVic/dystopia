# Dystopia em containers.
#
#   docker compose up -d                     # só Postgres + RabbitMQ (dev: app e
#                                            #   workers rodam na máquina)
#   docker compose --profile app up --build  # a stack INTEIRA: migrations, app
#                                            #   web em :3000, worker e pagamentos
#   docker compose --profile app run --rm migrate npm run db:seed
#                                            # popula com dados de exemplo
#   docker compose down [-v]                 # para (e, com -v, apaga os volumes)
#
# Portas na máquina: Postgres 5544 (não 5432, que costuma estar ocupada),
# RabbitMQ 5672 + painel http://localhost:15672 (dystopia / dystopia_dev_pw),
# app 3000. Tudo configurável por variável (POSTGRES_PORT, WEB_PORT…).
#
# Senhas e chave do MFA daqui são de DESENVOLVIMENTO — nunca use em
# produção (ver docs/DEPLOY.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dystopia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dystopia_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dystopia}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `npm run db:migrate` logo depois do `up -d` só funciona se o banco já
      # aceitar conexão — daí o healthcheck.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dystopia} -d ${POSTGRES_DB:-dystopia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dystopia}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dystopia_dev_pw}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # Porta AMQP aberta = broker pronto (o listener é a última coisa a
      # subir). NÃO use `rabbitmq-diagnostics ping` aqui: o healthcheck roda
      # como root e, se chegar antes do servidor, a CLI cria o .erlang.cookie
      # como root — o servidor (usuário rabbitmq) não lê e morre com eacces.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 5s
      timeout: 5s
      retries: 30


  # ---------------------------------------------------------------- stack (--profile app)
  web:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.web }
    environment: &app-env
      DATABASE_URL: postgresql://dystopia_app:${APP_DB_PASSWORD:-dystopia_app_dev_pw}@db:5432/${POSTGRES_DB:-dystopia}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dystopia}:${RABBITMQ_PASSWORD:-dystopia_dev_pw}@rabbitmq:5672
      # Chave de DESENVOLVIMENTO para cifrar o segredo do autenticador do admin.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-ZGVzZW52b2x2aW1lbnRvLXNvbWVudGUtdHJvcXVlLWo=}
      ALLOW_CHECKOUT_SIMULATION: ${ALLOW_CHECKOUT_SIMULATION:-1}
      # O app só está acessível pelo `proxy`, que sobrescreve os headers de IP.
      TRUST_PROXY_HEADERS: "1"
      # Stack local/CI: os testes de navegador criam várias contas do mesmo IP.
      # Em produção fica o padrão (5 cadastros/h e 10 logins/15 min por IP).
      SIGNUP_LIMIT_PER_HOUR: ${SIGNUP_LIMIT_PER_HOUR:-1000}
      LOGIN_LIMIT_PER_15MIN: ${LOGIN_LIMIT_PER_15MIN:-1000}
      SERVICE_REQUEST_LIMIT_PER_HOUR: ${SERVICE_REQUEST_LIMIT_PER_HOUR:-1000}
      ASSISTANT_LIMIT_PER_10MIN: ${ASSISTANT_LIMIT_PER_10MIN:-1000}
      CHECKOUT_LIMIT_PER_HOUR: ${CHECKOUT_LIMIT_PER_HOUR:-1000}
      COUPON_LIMIT_PER_10MIN: ${COUPON_LIMIT_PER_10MIN:-1000}
      CART_LIMIT_PER_10MIN: ${CART_LIMIT_PER_10MIN:-1000}
      REVIEW_LIMIT_PER_HOUR: ${REVIEW_LIMIT_PER_HOUR:-1000}
      WISHLIST_LIMIT_PER_10MIN: ${WISHLIST_LIMIT_PER_10MIN:-1000}
      MFA_LIMIT_PER_15MIN: ${MFA_LIMIT_PER_15MIN:-1000}
      MFA_LIMIT_PER_DAY: ${MFA_LIMIT_PER_DAY:-1000}
      # Assistente: sem chave, o botão nem aparece. Com chave da Groq (ou outro
      # provedor Chat Completions via CHAT_API_URL/CHAT_MODEL), ele responde.
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_API_URL: ${CHAT_API_URL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      # Cartão pelo Stripe em modo de teste (pk_test_…). Sem ela, cartão simulado.
      # A secreta vai só para o serviço `payments`, que é quem fala com o Stripe.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    # Sem porta publicada: só o `proxy` fala com ele (ver docker/Caddyfile).
    # Pronto = responde uma página que consulta o banco (não só "processo de pé").
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/produtos"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on: &after-migrate
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # Aplica as migrations, cria/atualiza o usuário do app e sai; app e workers
  # só sobem depois que ela terminou. Migration e seed rodam como DONO do
  # banco; app e workers, como `dystopia_app` (só lê e grava linha — ver
  # src/db/app-role.ts).
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.worker }
    command: ["sh", "-c", "npm run db:migrate && npm run db:app-role"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-dystopia}:${POSTGRES_PASSWORD:-dystopia_dev_pw}@db:5432/${POSTGRES_DB:-dystopia}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dystopia_app_dev_pw}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # Porta de entrada: sobrescreve X-Real-IP/X-Forwarded-For com o IP real da
  # conexão — sem isso o cliente forjaria o IP e furaria o limite de tentativas.
  proxy:
    profiles: [app]
    image: caddy:2.10-alpine
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

  # Filas `saga` e `notifications` + relay da outbox + reconciliação.
  worker:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.worker }
    environment:
      <<: *app-env
      WORKER_QUEUES: saga,notifications
    depends_on: *after-migrate
    restart: unless-stopped

  # Serviço de pagamentos em processo próprio (fila `payments`).
  payments:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.worker }
    command: ["node", "--import", "tsx", "src/scripts/payments-worker.ts"]
    environment:
      <<: *app-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on: *after-migrate
    restart: unless-stopped

# Sem nome fixo: o compose prefixa com o projeto, então duas cópias da stack
# (ou um teste isolado com `-p`) não disputam o mesmo volume.
volumes:
  pgdata:
  rabbitmqdata:
