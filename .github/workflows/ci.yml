# Verificação automática: tipos, lint, migrations, testes e build de produção.
#
# Os testes de integração precisam de Postgres e RabbitMQ de verdade (a suíte
# exercita `FOR UPDATE SKIP LOCKED`, transações, publisher confirm, filas de
# espera com TTL e DLQ), então o job sobe service containers em vez de mockar.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: tipos, lint, testes e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dystopia
          POSTGRES_PASSWORD: dystopia_dev_pw
          POSTGRES_DB: dystopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dystopia -d dystopia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: dystopia
          RABBITMQ_DEFAULT_PASS: dystopia_dev_pw
        ports:
          - 5672:5672
        # Porta aberta = pronto. `rabbitmq-diagnostics ping` como healthcheck
        # roda como root e pode criar o .erlang.cookie antes do servidor,
        # que aí não sobe (eacces) — ver docker-compose.yml.
        options: >-
          --health-cmd "nc -z 127.0.0.1 5672"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://dystopia:dystopia_dev_pw@localhost:5432/dystopia
      # Pagamentos tem banco próprio (o `db:migrate` cria este no CI).
      PAYMENTS_DATABASE_URL: postgresql://dystopia:dystopia_dev_pw@localhost:5432/dystopia_payments
      PAYMENTS_DATABASE_CREATE: "1"
      RABBITMQ_URL: amqp://dystopia:dystopia_dev_pw@localhost:5672
      # Chave de CI para os testes do MFA (nunca use em produção).
      MFA_ENCRYPTION_KEY: Y2ktc29tZW50ZS1wYXJhLXZlcmlmaWNhY2FvLW1mYSE=
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        # PageProps/RouteContext são tipos gerados pelo Next a partir das rotas
        # (em dev e no build eles já existem; aqui, numa máquina limpa, não).
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Migrations aplicam em banco limpo
        run: npm run db:migrate

      - name: Testes (unitários + integração)
        # O runner cria e migra `dystopia_test` e `dystopia_payments_test` sozinho.
        run: npm test

      - name: Build de produção
        run: npm run build

  e2e:
    name: navegador (Playwright) contra a stack em containers
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir a stack (migrations, app, worker, pagamentos)
        run: docker compose --profile app up -d --build --wait
        env:
          # Liga o botão do assistente; o teste intercepta a API, então a
          # chave nunca chega a um provedor.
          CHAT_API_KEY: e2e-sem-modelo
          # Chaves de TESTE do Stripe (secrets do repositório). Sem elas, o
          # `stripe.spec.ts` é pulado e o cartão segue simulado.
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Popular o banco
        run: docker compose --profile app run --rm migrate npm run db:seed

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Testes de navegador
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Logs da stack (se falhar)
        if: failure()
        run: docker compose --profile app logs --no-color

      # Trace do Playwright (DOM, rede, console) de cada teste que falhou.
      # Só dado de teste da stack descartável — a chave secreta do Stripe
      # fica no container de pagamentos e nunca chega ao navegador.
      - name: Traces dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
