# Atualização das GitHub Actions, dos pacotes npm e da imagem Docker.
#
# Nas actions, as de terceiros ficam presas pelo hash do commit
# (`@<sha> # vX.Y.Z`): imutável, então uma tag movida por quem invadiu
# o repositório da action não muda o que roda aqui. O preço é não atualizar
# sozinho — o Dependabot abre um PR com o hash novo, e a CI roda nele antes
# do merge, como em qualquer outro.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    # Um PR por semana com todas as actions, em vez de um por action.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # Pacotes npm do app e da infra (Pulumi). Correção de falha conhecida NÃO
  # espera esta agenda: o "Dependabot security updates" (ligado no repositório)
  # abre o PR na hora em que o alerta sai. Esta agenda é a atualização comum,
  # agrupada para virar um PR por semana, e não um por pacote.
  - package-ecosystem: npm
    directories: ["/", "/infra"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    # Node é uma versão principal só em todo lugar: o `engines` do package.json
    # (lido pela Vercel e pela CI), os Dockerfiles e o @types/node. Trocar de
    # versão principal é decisão, não rotina: muda os três juntos num PR feito
    # à mão, quando a Vercel suportar a versão nova.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Imagem base dos containers (docker/Dockerfile.web e docker/Dockerfile.worker).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    # Mesma regra do npm: versão principal do Node só junto com o `engines`.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
    open-pull-requests-limit: 2
